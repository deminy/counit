name: Compatibility Tests

on: [ push, pull_request, workflow_dispatch ]

jobs:
  ci:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - {phpunit: "~12.5.24", php: "8.3"}
          - {phpunit: "~13.0", php: "8.4"}
        extensions:
          - swoole-stable
          - ""

    name: PHPUnit ${{ matrix.env.phpunit }} on PHP ${{ matrix.env.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.env.php }}
          tools: composer:v2
          extensions: ${{ matrix.extensions }}
          # pcov powers the aggregate-coverage step below; it collects nothing unless a run
          # requests coverage, so every other step is unaffected.
          coverage: pcov

      - name: Install Dependencies
        run: composer install -nq --no-progress

      - name: Test Compatibility with PHPUnit
        # The reported assertion total is checked too, not just the exit code: counit corrects that
        # total at the end of a run (see Deminy\Counit\CounitExtension), and a regression there --
        # e.g. delayed assertions being wiped instead of counted -- lowers the total silently while
        # the run still exits 0. The expected result is identical with and without Swoole.
        run: |
          set -o pipefail
          ./counit --testsuite compatibility | tee /tmp/compatibility.log
          grep -qF 'OK (59 tests, 72 assertions)' /tmp/compatibility.log

      - name: Test Late Skip/Incomplete Handling
        # A skip/incomplete signalled after the test's first yield cannot be made native (the
        # Throwable only exists after PHPUnit reported the test as passed), but it is now
        # replayed through PHPUnit's own Test\Skipped/Test\MarkedIncomplete events once every
        # coroutine has drained (see LateSkips): the summary counts, the listings and the
        # --fail-on-skipped/--fail-on-incomplete exit codes match blocking mode exactly, so the
        # expected output is identical with and without Swoole and the old STDERR notice must be
        # absent. The data-set target pins the identity handling (deferred verdicts are stashed
        # with the test's event value object -- ID-string matching silently misses data-provider
        # tests); the cleanup target pins that a skip from a Counit::defer() cleanup is a skip
        # with exit code 0, not a deferred failure forcing exit code 1. These cannot live in the
        # exact-summary-gated suite above, since skipped tests change that summary line by
        # design.
        run: |
          for target in LateSkipTest LateSkipCleanupTest LateSkipDataSetTest; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/late-skip.log 2> /tmp/late-skip.err || rc=$?
            cat /tmp/late-skip.log /tmp/late-skip.err
            test "$rc" -eq 0
            # The verdicts are native now: neither the fallback notice nor a deferred failure
            # may appear.
            ! grep -qF 'status remains "passed"' /tmp/late-skip.err
            ! grep -qF 'already been reported as passed' /tmp/late-skip.err
            case "$target" in
              LateSkipTest)        grep -qF 'Tests: 3, Assertions: 0, Skipped: 2, Incomplete: 1.' /tmp/late-skip.log ;;
              LateSkipCleanupTest) grep -qF 'Tests: 1, Assertions: 1, Skipped: 1.' /tmp/late-skip.log ;;
              LateSkipDataSetTest) grep -qF 'Tests: 2, Assertions: 1, Skipped: 1.' /tmp/late-skip.log ;;
            esac
          done
          # The late verdicts appear in the listings with their real names and messages ...
          ./counit -c phpunit.xml.dist --display-skipped --display-incomplete tests/regression/LateSkipTest.php > /tmp/late-skip.log 2> /dev/null
          grep -qF 'LateSkipTest::testSkippedAfterYield' /tmp/late-skip.log
          grep -qF 'skipped after the first yield: replayed at the end of the run' /tmp/late-skip.log
          grep -qF 'LateSkipTest::testIncompleteAfterYield' /tmp/late-skip.log
          # ... and the --fail-on-* exit codes are exact in both modes.
          rc=0; ./counit -c phpunit.xml.dist --fail-on-skipped    tests/regression/LateSkipTest.php > /dev/null 2>&1 || rc=$?; test "$rc" -eq 1
          rc=0; ./counit -c phpunit.xml.dist --fail-on-incomplete tests/regression/LateSkipTest.php > /dev/null 2>&1 || rc=$?; test "$rc" -eq 1
          # The replay must survive an active JUnit logger: its testsuite stack has already
          # unwound when ExecutionFinished fires, and an unshielded replayed event used to kill
          # the whole run (exit code 255, zero-byte report). The summary must stay exact and the
          # report must be written and well-formed in both modes.
          rc=0
          ./counit -c phpunit.xml.dist --log-junit /tmp/late-skip.xml tests/regression/LateSkipTest.php > /tmp/late-skip.log 2> /tmp/late-skip.err || rc=$?
          cat /tmp/late-skip.log /tmp/late-skip.err
          test "$rc" -eq 0
          grep -qF 'Tests: 3, Assertions: 0, Skipped: 2, Incomplete: 1.' /tmp/late-skip.log
          ! grep -qF 'status remains "passed"' /tmp/late-skip.err
          test -s /tmp/late-skip.xml
          grep -qF '</testsuites>' /tmp/late-skip.xml
          test "$(grep -c '<testcase' /tmp/late-skip.xml)" -eq 3
          # The report carries the verdicts (JunitXmlCorrector writes the late <skipped/>
          # elements and recomputes the aggregate), identical with and without Swoole.
          test "$(grep -c '<skipped/>' /tmp/late-skip.xml)" -eq 3
          grep -qF 'skipped="3"' /tmp/late-skip.xml

      - name: Test Depends Failure Semantics
        # A producer failing only after a yield used to be recorded as passed at that yield: its
        # failure was deferred to an end-of-run notice and its dependent ran anyway. With the
        # producer's coroutine joined, the failure lands inside runBare() like in blocking mode:
        # a real Failure, the dependent Skipped, exit code 1, and no deferred-failure block. The
        # expected output is identical with and without Swoole. This cannot live in the
        # exact-summary-gated suite above, since the run is expected to fail.
        run: |
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/DependsFailureTest.php > /tmp/depends-fail.log 2> /tmp/depends-fail.err || rc=$?
          cat /tmp/depends-fail.log /tmp/depends-fail.err
          test "$rc" -eq 1
          grep -qF 'Tests: 3, Assertions: 2, Failures: 1, Skipped: 1.' /tmp/depends-fail.log
          # The dependent must not have run (its body fails loudly if it does) ...
          ! grep -qF 'the dependent of a failed producer must be skipped' /tmp/depends-fail.log
          # ... and the producer's failure must be a real one, not a deferred end-of-run notice.
          ! grep -qF 'already been reported as passed' /tmp/depends-fail.err
          # A joined producer's after-test hooks run natively: a throwing tearDown() errors the
          # producer itself (exit 2, no deferred block) and its dependent is skipped -- while a
          # later non-joined test of the same class still gets the relocated (post-body) hooks,
          # and a SECOND join cycle in the same class still delivers its value.
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/DependsTearDownTest.php > /tmp/depends-td.log 2> /tmp/depends-td.err || rc=$?
          cat /tmp/depends-td.log /tmp/depends-td.err
          test "$rc" -eq 2
          grep -qF 'Tests: 6, Assertions: 5, Errors: 1, Skipped: 1.' /tmp/depends-td.log
          ! grep -qF 'the dependent of an errored producer must be skipped' /tmp/depends-td.log
          ! grep -qF 'already been reported as passed' /tmp/depends-td.err
          # A joined producer that performs no assertions must stay RISKY under Swoole -- the
          # join path applies no up-front assertion credit (a credited producer would count one
          # assertion and lose the verdict). PHPUnit 12/13 records the producer's pass and
          # return value regardless of the risky verdict, so the dependent still runs with the
          # real value; the expected output is the exact blocking shape, in both modes.
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/DependsRiskyProducerTest.php > /tmp/depends-risky.log 2> /tmp/depends-risky.err || rc=$?
          cat /tmp/depends-risky.log /tmp/depends-risky.err
          test "$rc" -eq 0
          grep -qF 'Tests: 2, Assertions: 1, Risky: 1.' /tmp/depends-risky.log
          grep -qF 'This test did not perform any assertions' /tmp/depends-risky.log

      - name: Test After-Test Hook Edge Semantics
        # Two edges around the relocated tearDown()/#[After] hooks. (1) A test whose setUp()
        # throws or skips never starts a coroutine, so its hooks must be handed back to PHPUnit's
        # native invocation: tearDown() still runs (a guard test asserts the side effect), a
        # Throwable it raises after the failed setUp() is swallowed (the setUp() error stands),
        # and the class's next test gets the relocated replay again -- identical output with and
        # without Swoole. (2) A skip signalled from tearDown() after a passing body is a test
        # FAILURE under blocking PHPUnit, never a skip; under Swoole the verdict only exists
        # after the test's report and is replayed as PHPUnit's own Test\Failed event (see
        # LateFailures -- PHPUnit's SkippedWithMessageException extends AssertionFailedError, so
        # the classification is upstream's own), converging the summary and exit code with
        # blocking mode exactly.
        run: |
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/SetUpFailureHooksTest.php > /tmp/setup-fail.log 2> /tmp/setup-fail.err || rc=$?
          cat /tmp/setup-fail.log /tmp/setup-fail.err
          test "$rc" -eq 2
          grep -qF 'Tests: 5, Assertions: 4, Errors: 1, Skipped: 1.' /tmp/setup-fail.log
          # tearDown() must have run for both aborted tests (the guard test fails otherwise) ...
          ! grep -qF 'tearDown() must run' /tmp/setup-fail.log
          # ... its own post-setUp-failure Throwable must be swallowed, as under blocking PHPUnit ...
          ! grep -qF 'must be swallowed' /tmp/setup-fail.log
          ! grep -qF 'must be swallowed' /tmp/setup-fail.err
          # ... and nothing may surface as a deferred end-of-run failure.
          ! grep -qF 'already been reported as passed' /tmp/setup-fail.err
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/TearDownSkipTest.php > /tmp/teardown-skip.log 2> /tmp/teardown-skip.err || rc=$?
          cat /tmp/teardown-skip.log /tmp/teardown-skip.err
          test "$rc" -eq 1
          grep -qF 'Tests: 2, Assertions: 2, Failures: 1.' /tmp/teardown-skip.log
          ! grep -qF 'already been reported as passed' /tmp/teardown-skip.err
          # In neither mode may the skip be honored as a skip.
          ! grep -qF 'Skipped:' /tmp/teardown-skip.log

      - name: Test Exception Expectation Semantics
        # A test whose expected exception is thrown only after a yield used to fail prematurely
        # with "exception not thrown" (PHPUnit verifies the expectation as soon as
        # invokeTestMethod() returns -- the body's first yield), with the real Throwable arriving
        # as a deferred duplicate. counit now joins the coroutine of a test that has an exception
        # expectation registered at its first yield, so PHPUnit verifies natively: a mismatch
        # fails with the real comparison message, a never-arriving exception fails natively after
        # the finished body, and a tearDown() throwing the very class the test expects ERRORS the
        # test (the joined test's hooks run natively, strictly after the verification) instead of
        # falsely satisfying the expectation. Identical with and without Swoole; the passing
        # shapes live in the exact-summary-gated suite above.
        run: |
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/ExceptionFailureTest.php > /tmp/exception-fail.log 2> /tmp/exception-fail.err || rc=$?
          cat /tmp/exception-fail.log /tmp/exception-fail.err
          test "$rc" -eq 2
          grep -qF 'Tests: 4, Assertions: 4, Errors: 1, Failures: 2.' /tmp/exception-fail.log
          # The real, native failure/error classifications ...
          grep -qF 'Failed asserting that exception of type "LogicException" matches expected exception "RuntimeException"' /tmp/exception-fail.log
          grep -qF 'Failed asserting that exception of type "RuntimeException" is thrown.' /tmp/exception-fail.log
          grep -qF 'deliberate tearDown() throw of the very class the test expects' /tmp/exception-fail.log
          # ... and nothing may surface as a deferred end-of-run failure.
          ! grep -qF 'already been reported as passed' /tmp/exception-fail.err

      - name: Test Time Limit Enforcement
        # --enforce-time-limit used to measure only up to a test's first yield under Swoole (an
        # over-limit test simply passed), and the SIGALRM php-invoker arms could outlive a joined
        # test's runBare() and abort an unrelated test's coroutine. counit now joins every test at
        # its first yield while the option is active, so PHPUnit times the real runBare() and
        # reports the timeout natively -- risky verdict, exact message, --fail-on-risky honored --
        # at the cost of the run being serialized for its duration. The expected output is
        # identical with and without Swoole; pcntl is required in both modes (PHPUnit itself
        # silently skips enforcement without it), hence the guard so a runner losing pcntl fails
        # loudly instead of the whole step silently passing for the wrong reason.
        run: |
          php -r 'exit(extension_loaded("pcntl") ? 0 : 1);'
          for target in TimeLimitAutomaticTest TimeLimitManualTest TimeLimitLargeTest; do
            rc=0
            ./counit -c phpunit.xml.dist --enforce-time-limit --default-time-limit=1 "tests/regression/${target}.php" > /tmp/time-limit.log 2> /tmp/time-limit.err || rc=$?
            cat /tmp/time-limit.log /tmp/time-limit.err
            test "$rc" -eq 0
            # Nothing may surface as a deferred end-of-run failure: the timeout must land inside
            # PHPUnit's native handling, not in counit's after-the-summary block.
            ! grep -qF 'already been reported as passed' /tmp/time-limit.err
            case "$target" in
              TimeLimitAutomaticTest)
                grep -qF 'Tests: 2, Assertions: 1, Risky: 1.' /tmp/time-limit.log
                grep -qF 'This test was aborted after 1 second' /tmp/time-limit.log
                ;;
              TimeLimitManualTest)
                grep -qF 'Tests: 2, Assertions: 1, Risky: 1.' /tmp/time-limit.log
                grep -qF 'This test was aborted after 1 second' /tmp/time-limit.log
                ;;
              TimeLimitLargeTest)
                # A #[Large] class sleeps past the 1-second default limit but under the 60-second
                # large-test limit: the per-size timeout selection is PHPUnit's own in both modes.
                grep -qF 'OK (1 test, 1 assertion)' /tmp/time-limit.log
                ;;
            esac
          done
          # The serialized-run notice is printed under Swoole only, and --fail-on-risky must flip
          # the exit code natively in both modes.
          if php -r 'exit(extension_loaded("swoole") ? 0 : 1);'; then
            grep -qF 'the run is serialized' /tmp/time-limit.err
          fi
          rc=0
          ./counit -c phpunit.xml.dist --enforce-time-limit --default-time-limit=1 --fail-on-risky tests/regression/TimeLimitAutomaticTest.php > /tmp/time-limit-risky.log 2>&1 || rc=$?
          cat /tmp/time-limit-risky.log
          test "$rc" -eq 1

      - name: Test Global-State Backup Semantics
        # #[BackupGlobals]/#[BackupStaticProperties]/#[WithEnvironmentVariable]: PHPUnit snapshots
        # at the top of runBare() and restores at its bottom, which under Swoole used to be the
        # body's first yield -- the test's own pre-yield mutations (an injected env var included)
        # were reverted mid-body, its post-yield mutations leaked, on the join paths the restore
        # wiped concurrent tests' global writes, and a static-properties snapshot rewound counit's
        # own bookkeeping (skewing the assertion total and double-running later tearDown()s).
        # counit now drains all in-flight coroutines before the snapshot (at PreparationStarted,
        # the seam just ahead of it), joins the backed-up test so the restore follows the real
        # body, and repairs its hook-takeover state after a static-properties restore. The
        # expected output is identical with and without Swoole, including under a run-wide
        # --globals-backup (which honestly serializes, with a notice under Swoole) and under
        # --strict-global-state (whose before/after comparison now brackets the same exclusive
        # window as in blocking mode).
        run: |
          for target in BackupGlobalsTest BackupGlobalsManualTest BackupCollateralTest BackupStaticHooksTest WithEnvironmentVariableTest; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/backup.log 2> /tmp/backup.err || rc=$?
            cat /tmp/backup.log /tmp/backup.err
            test "$rc" -eq 0
            # Nothing may surface as a deferred end-of-run failure.
            ! grep -qF 'already been reported as passed' /tmp/backup.err
            case "$target" in
              BackupGlobalsTest)           grep -qF 'OK (2 tests, 4 assertions)' /tmp/backup.log ;;
              BackupGlobalsManualTest)     grep -qF 'OK (2 tests, 3 assertions)' /tmp/backup.log ;;
              BackupCollateralTest)        grep -qF 'OK (3 tests, 3 assertions)' /tmp/backup.log ;;
              BackupStaticHooksTest)       grep -qF 'OK (4 tests, 4 assertions)' /tmp/backup.log ;;
              WithEnvironmentVariableTest) grep -qF 'OK (2 tests, 4 assertions)' /tmp/backup.log ;;
            esac
          done
          # Run-wide backup configuration: same exact output, serialized under Swoole (notice).
          rc=0
          ./counit -c phpunit.xml.dist --globals-backup tests/regression/BackupGlobalsTest.php > /tmp/backup-cfg.log 2> /tmp/backup-cfg.err || rc=$?
          cat /tmp/backup-cfg.log /tmp/backup-cfg.err
          test "$rc" -eq 0
          grep -qF 'OK (2 tests, 4 assertions)' /tmp/backup-cfg.log
          if php -r 'exit(extension_loaded("swoole") ? 0 : 1);'; then
            grep -qF 'the run is serialized' /tmp/backup-cfg.err
          fi
          # --strict-global-state: the mutating backed-up test is flagged risky, natively, in
          # both modes -- its comparison snapshots now bracket the same exclusive window.
          rc=0
          ./counit -c phpunit.xml.dist --strict-global-state tests/regression/BackupGlobalsTest.php > /tmp/backup-strict.log 2>&1 || rc=$?
          cat /tmp/backup-strict.log
          test "$rc" -eq 0
          grep -qF 'Tests: 2, Assertions: 4, Risky: 1.' /tmp/backup-strict.log
          grep -qF 'This test modified global state but was not expected to do so' /tmp/backup-strict.log

      - name: Test Post-Condition Hooks
        # PHPUnit runs the post-condition phase (assertPostConditions() and #[PostCondition]
        # methods) from runBare(), right after the test method invocation returns -- under counit,
        # the test body's first yield -- so a customized hook used to inspect the test while its
        # body was still in flight, and it ran even when the body failed only after a yield
        # (blocking PHPUnit skips the phase for a failed body). counit now detects a class that
        # customizes the phase by reflection and joins every one of its tests, so the phase runs
        # after the finished body and a throwing hook fails/errors/skips the test natively. Since
        # joined tests get no assertion credit, a customizing test performing no assertions is
        # risky again, exactly as under blocking PHPUnit (the Risky target); the Skip target pins
        # the skip-on-failure half: the post-yield body failure is native (not deferred) and the
        # hook must not have run. The expected output is identical with and without Swoole.
        run: |
          for target in PostConditionsTest PostConditionsManualTest PostConditionAttributeTest PostConditionsRiskyTest PostConditionsSkipTest; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/postcond.log 2> /tmp/postcond.err || rc=$?
            cat /tmp/postcond.log /tmp/postcond.err
            # Nothing may surface as a deferred end-of-run failure.
            ! grep -qF 'already been reported as passed' /tmp/postcond.err
            case "$target" in
              PostConditionsTest)
                test "$rc" -eq 0
                grep -qF 'OK (2 tests, 4 assertions)' /tmp/postcond.log ;;
              PostConditionsManualTest)
                test "$rc" -eq 0
                grep -qF 'OK (2 tests, 4 assertions)' /tmp/postcond.log ;;
              PostConditionAttributeTest)
                test "$rc" -eq 0
                grep -qF 'OK (1 test, 2 assertions)' /tmp/postcond.log ;;
              PostConditionsRiskyTest)
                test "$rc" -eq 0
                grep -qF 'Tests: 1, Assertions: 0, Risky: 1.' /tmp/postcond.log
                grep -qF 'This test did not perform any assertions' /tmp/postcond.log ;;
              PostConditionsSkipTest)
                test "$rc" -eq 1
                grep -qF 'Tests: 1, Assertions: 1, Failures: 1.' /tmp/postcond.log
                # The test fails natively with the BODY's message; the post-condition hook
                # must never have run for the failed body.
                grep -qF 'late failure' /tmp/postcond.log
                ! grep -qF 'post-conditions must not run' /tmp/postcond.log ;;
            esac
          done

      - name: Test Output Expectations
        # Swoole gives every coroutine its own output-buffer stack, so PHPUnit's buffer --
        # opened on the runner coroutine at the top of runBare() -- never saw a byte the test
        # body echoed from inside its coroutine: expectOutputString()/expectOutputRegex()
        # compared against '' unconditionally (before OR after a yield), the output leaked raw
        # to the terminal, and --disallow-test-output was a silent no-op. counit now captures
        # each coroutine's output, joins a test with a registered expectation at its first
        # yield, and replays the captured bytes into PHPUnit's still-open buffer, so match,
        # mismatch and never-printed all verify natively against the real, complete output.
        # The pollution target pins the isolation (noisy bystanders overlapping expecting
        # tests); the risky target pins --disallow-test-output, which joins EVERY test (the
        # run serializes, with a notice under Swoole) so the unexpected-output risky check is
        # exact. The expected output is identical with and without Swoole.
        run: |
          for target in OutputExpectationTest OutputExpectationManualTest OutputMismatchTest OutputPollutionTest; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/output.log 2> /tmp/output.err || rc=$?
            cat /tmp/output.log /tmp/output.err
            # Nothing may surface as a deferred end-of-run failure.
            ! grep -qF 'already been reported as passed' /tmp/output.err
            case "$target" in
              OutputExpectationTest)
                test "$rc" -eq 0
                grep -qF 'OK (3 tests, 3 assertions)' /tmp/output.log ;;
              OutputExpectationManualTest)
                test "$rc" -eq 0
                grep -qF 'OK (2 tests, 2 assertions)' /tmp/output.log ;;
              OutputMismatchTest)
                test "$rc" -eq 1
                grep -qF 'Tests: 2, Assertions: 2, Failures: 2.' /tmp/output.log
                # The failures must carry the REAL actual output, not the empty string the
                # broken capture used to compare against.
                grep -qF "+'actual'" /tmp/output.log ;;
              OutputPollutionTest)
                test "$rc" -eq 0
                grep -qF 'OK (5 tests, 5 assertions)' /tmp/output.log ;;
            esac
          done
          # Without --disallow-test-output a printing test stays green ...
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/OutputRiskyTest.php > /tmp/output.log 2>&1 || rc=$?
          cat /tmp/output.log
          test "$rc" -eq 0
          grep -qF 'OK (1 test, 1 assertion)' /tmp/output.log
          # ... and with it, the risky verdict carries the literal printed text, exactly as
          # under blocking PHPUnit (where the option used to be a silent no-op under Swoole).
          rc=0
          ./counit -c phpunit.xml.dist --disallow-test-output tests/regression/OutputRiskyTest.php > /tmp/output.log 2> /tmp/output.err || rc=$?
          cat /tmp/output.log /tmp/output.err
          test "$rc" -eq 0
          grep -qF 'Tests: 1, Assertions: 1, Risky: 1.' /tmp/output.log
          grep -qF 'printed unexpected output: unexpected-output' /tmp/output.log
          if php -r 'exit(extension_loaded("swoole") ? 0 : 1);'; then
            grep -qF 'the run is serialized' /tmp/output.err
          fi

      - name: Test Useless-Test Detection
        # The "did not perform any assertions" risky check (and its mirror, "not expected to
        # perform assertions but performed N") reads the count the moment the test method
        # invocation returns -- under counit, the body's first yield -- so counit's up-front
        # credit, which exists to suppress FALSE risky verdicts for post-yield assertions, used
        # to also suppress every TRUE one. Now the credit is declined once the body is known
        # finished (native verdicts for never-yielding tests), and for yielding tests whose
        # coroutine never ran unattributed code the verdict is emitted at the end of the run
        # through PHPUnit's own ConsideredRisky event -- listing, summary count and the
        # --fail-on-risky exit code included. This step asserts summaries AND exit codes in all
        # three flag states; the exempt file asserts the ABSENCE of the message; the
        # unobservable file pins the documented residual (silent under Swoole -- an
        # untrustworthy tally must never become a false accusation -- flagged without it).
        run: |
          for target in UselessTestTest UselessTestManualTest UselessTestSiblingTest; do
            # --do-not-report-useless-tests silences the "did not perform any assertions"
            # verdict only: PHPUnit gates that one on reportUselessTests() but emits the mirror
            # verdict unconditionally (TestRunner::run()), so the declared-none-but-asserting
            # sibling fixture stays risky in the quiet state -- in both modes.
            case "$target" in
              UselessTestTest)        plain='Tests: 3, Assertions: 1, Risky: 2.'; quiet='OK (3 tests, 1 assertion)' ;;
              UselessTestManualTest)  plain='Tests: 2, Assertions: 1, Risky: 1.'; quiet='OK (2 tests, 1 assertion)' ;;
              UselessTestSiblingTest) plain='Tests: 2, Assertions: 2, Risky: 2.'; quiet='Tests: 2, Assertions: 2, Risky: 2.' ;;
            esac
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/useless.log 2>&1 || rc=$?
            cat /tmp/useless.log
            test "$rc" -eq 0
            grep -qF "$plain" /tmp/useless.log
            rc=0
            ./counit -c phpunit.xml.dist --fail-on-risky "tests/regression/${target}.php" > /dev/null 2>&1 || rc=$?
            test "$rc" -eq 1
            rc=0
            ./counit -c phpunit.xml.dist --do-not-report-useless-tests "tests/regression/${target}.php" > /tmp/useless.log 2>&1 || rc=$?
            cat /tmp/useless.log
            test "$rc" -eq 0
            grep -qF "$quiet" /tmp/useless.log
          done
          # Exemptions: a declared-none test (attribute or in-body call) and a post-yield abort
          # are never reported, in either mode -- and since the LateSkips replay, the post-yield
          # skip appears in the summary identically in both modes while STILL not being flagged.
          ./counit -c phpunit.xml.dist tests/regression/UselessTestExemptTest.php > /tmp/useless.log 2>&1
          cat /tmp/useless.log
          ! grep -qF 'did not perform any assertions' /tmp/useless.log
          grep -qF 'Tests: 3, Assertions: 0, Skipped: 1.' /tmp/useless.log
          # Documented residual: an unobservable yield stays silent under Swoole (never a false
          # accusation), and is flagged natively without it.
          rc=0
          ./counit -c phpunit.xml.dist --fail-on-risky tests/regression/UselessTestUnobservableTest.php > /tmp/useless.log 2>&1 || rc=$?
          cat /tmp/useless.log
          if php -r 'exit(extension_loaded("swoole") ? 0 : 1);'; then
            test "$rc" -eq 0
          else
            test "$rc" -eq 1
            grep -qF 'This test did not perform any assertions' /tmp/useless.log
          fi

      - name: Test Error/Exception Handler Isolation
        # PHPUnit snapshots the error/exception handler stacks at the top of runBare() and
        # compares/restores them at its bottom -- under counit, the body's first yield --
        # unconditionally, for every test. The stacks are process-global under Swoole (unlike
        # the output-buffer stack), so this used to break four ways: a legal handler spanning a
        # yield was stripped mid-body and falsely flagged, a post-yield registration leaked
        # unreported (and could swallow other tests' diagnostics), and a bystander whose window
        # covered someone else's leak was blamed for it. counit now lifts each coroutine's own
        # handlers off the shared stack while it is suspended and puts them back on resume (see
        # HandlerIsolation); leaks are reported with PHPUnit's exact wording against the test
        # that actually holds them -- natively for never-yielding tests, via the end-of-run
        # emit otherwise. The attribution target must grep the risky TEST NAME, not the count:
        # the broken behavior has the same count with the wrong name. The expected output is
        # identical with and without Swoole.
        run: |
          # A test's own handler must survive its yield: clean, nothing risky, nothing deferred.
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/HandlerSpanTest.php > /tmp/handler.log 2> /tmp/handler.err || rc=$?
          cat /tmp/handler.log /tmp/handler.err
          test "$rc" -eq 0
          grep -qF 'OK (1 test, 1 assertion)' /tmp/handler.log
          ! grep -qF 'did not remove its own error handlers' /tmp/handler.log
          ! grep -qF 'already been reported as passed' /tmp/handler.err
          # All four verdict kinds, before and after the first yield; --fail-on-risky exits 1.
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/HandlerLeakTest.php > /tmp/handler.log 2>&1 || rc=$?
          cat /tmp/handler.log
          test "$rc" -eq 0
          grep -qF 'Tests: 4, Assertions: 4, Risky: 4.' /tmp/handler.log
          test "$(grep -cF 'did not remove its own error handlers' /tmp/handler.log)" -eq 2
          grep -qF 'did not remove its own exception handlers' /tmp/handler.log
          grep -qF 'removed error handlers other than its own' /tmp/handler.log
          rc=0
          ./counit -c phpunit.xml.dist --fail-on-risky tests/regression/HandlerLeakTest.php > /dev/null 2>&1 || rc=$?
          test "$rc" -eq 1
          # The verdict must name the leaker, never an innocent bystander.
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/HandlerAttributionTest.php > /tmp/handler.log 2>&1 || rc=$?
          cat /tmp/handler.log
          test "$rc" -eq 0
          grep -qF 'Tests: 4, Assertions: 4, Risky: 1.' /tmp/handler.log
          grep -qF 'HandlerAttributionTest::testALeaksAfterAShortYield' /tmp/handler.log
          ! grep -qF 'testInnocentBystander' /tmp/handler.log
          # A leaked handler must not swallow a later test's deprecation.
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/HandlerCanaryTest.php > /tmp/handler.log 2>&1 || rc=$?
          cat /tmp/handler.log
          test "$rc" -eq 0
          grep -qF 'Tests: 2, Assertions: 2, Deprecations: 1, Risky: 1.' /tmp/handler.log

      - name: Test Mock Expectation Verification
        # PHPUnit verifies every registered mock from runBare(), right after runTest() returns --
        # under Swoole that used to be the body's first yield: an expectation satisfied only
        # after a sleep/IO yield failed prematurely ("was never invoked"), and -- because a
        # passing verification also strips the mock's invocation mocker -- a never()/exceeded-
        # count violation after the yield passed SILENTLY with exit code 0. counit now joins a
        # test that has a registered mock carrying an invocation-count rule at its first yield
        # (see MockExpectations), so PHPUnit verifies the truly finished body and classifies
        # natively in both directions. Stubs and mocks without a count rule are never verified
        # by PHPUnit and are not joined. The expected output is identical with and without
        # Swoole, except the final, documented residual: a mock created only after the first
        # yield is invisible at the join decision and stays unverified.
        run: |
          for target in MockExpectationTest MockSetUpTest MockExpectationManualTest MockStubTest MockPostConditionInterplayTest; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/mock.log 2> /tmp/mock.err || rc=$?
            cat /tmp/mock.log /tmp/mock.err
            test "$rc" -eq 0
            # Nothing may surface as a deferred end-of-run failure: every covered verdict is
            # native.
            ! grep -qF 'already been reported as passed' /tmp/mock.err
            case "$target" in
              MockExpectationTest)            grep -qF 'OK (3 tests, 3 assertions)' /tmp/mock.log ;;
              MockSetUpTest)                  grep -qF 'OK (1 test, 1 assertion)' /tmp/mock.log ;;
              MockExpectationManualTest)      grep -qF 'OK (1 test, 1 assertion)' /tmp/mock.log ;;
              MockStubTest)                   grep -qF 'OK (2 tests, 2 assertions)' /tmp/mock.log ;;
              MockPostConditionInterplayTest) grep -qF 'OK (1 test, 2 assertions)' /tmp/mock.log ;;
            esac
          done
          # Genuine violations stay native failures -- in both directions: an expectation never
          # satisfied, and a never() expectation violated only after a yield (the shape that
          # passed silently before the fix).
          for target in MockFailureTest MockNeverViolatedTest; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/mock-fail.log 2> /tmp/mock-fail.err || rc=$?
            cat /tmp/mock-fail.log /tmp/mock-fail.err
            test "$rc" -eq 1
            grep -qF 'Tests: 1, Assertions: 1, Failures: 1.' /tmp/mock-fail.log
            ! grep -qF 'already been reported as passed' /tmp/mock-fail.err
            case "$target" in
              # PHPUnit 13 reworded both verification failures; the 12.5 line keeps the
              # legacy phrasing, so each grep accepts either.
              MockFailureTest)      grep -qE 'was expected to be invoked once but was never invoked|was expected to be called 1 time, actually called 0 times' /tmp/mock-fail.log ;;
              MockNeverViolatedTest) grep -qE 'was not expected to be called, actually called 1 time|was not expected to be called\.' /tmp/mock-fail.log ;;
            esac
          done
          # Documented residual: a mock created only after the first yield is never verified
          # under Swoole (blocking mode fails the test).
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/MockLateCreationTest.php > /tmp/mock-late.log 2>&1 || rc=$?
          cat /tmp/mock-late.log
          if php -r 'exit(extension_loaded("swoole") ? 0 : 1);'; then
            test "$rc" -eq 0
            grep -qF 'OK (1 test, 1 assertion)' /tmp/mock-late.log
          else
            test "$rc" -eq 1
            grep -qF 'Tests: 1, Assertions: 2, Failures: 1.' /tmp/mock-late.log
            grep -qE 'was expected to be invoked once but was never invoked|was expected to be called 1 time, actually called 0 times' /tmp/mock-late.log
          fi

      - name: Test Post-Yield Diagnostics
        # PHPUnit's converting error handler is disabled the moment the test-method invocation
        # returns -- the first yield -- so a deprecation/warning/notice a test triggered after it
        # used to reach PHP's default handler: printed raw, absent from the summary counts, the
        # --display-* listings, the baseline and the --fail-on-* exit codes. counit now arms a
        # delegating handler for exactly the windows PHPUnit's own cannot cover (while the
        # coroutine PHPUnit runs on is suspended) and hands each diagnostic to PHPUnit's own
        # ErrorHandler at trigger time, so attribution and every downstream decision stay
        # upstream code (see Diagnostics). The failure mode is silent -- a lost diagnostic
        # lowers a count without failing the run -- so the exact blocking-mode summaries are
        # asserted, identical with and without Swoole, plus the absence of raw diagnostic text.
        run: |
          for target in PostYieldDiagnosticsTest PostYieldDiagnosticsManualTest PostYieldDiagnosticsAttributionTest; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/diag.log 2> /tmp/diag.err || rc=$?
            cat /tmp/diag.log /tmp/diag.err
            test "$rc" -eq 0
            # Raw PHP diagnostic text is the signature of an unconverted diagnostic ...
            ! grep -qE '^(Deprecated|Warning|Notice): ' /tmp/diag.log
            ! grep -qE '^(Deprecated|Warning|Notice): ' /tmp/diag.err
            # ... and nothing may surface as a deferred end-of-run failure.
            ! grep -qF 'already been reported as passed' /tmp/diag.err
            case "$target" in
              PostYieldDiagnosticsTest)            grep -qF 'Tests: 6, Assertions: 6, Warnings: 2, Deprecations: 2, Notices: 1.' /tmp/diag.log ;;
              PostYieldDiagnosticsManualTest)      grep -qF 'Tests: 2, Assertions: 2, Warnings: 1, Deprecations: 1.' /tmp/diag.log ;;
              PostYieldDiagnosticsAttributionTest) grep -qF 'Tests: 2, Assertions: 2, Deprecations: 1.' /tmp/diag.log ;;
            esac
          done
          # The late diagnostics appear in the listings with their real messages, the baseline
          # captures them, and the --fail-on-* exit codes are exact in both modes.
          ./counit -c phpunit.xml.dist --display-deprecations --display-warnings --display-notices tests/regression/PostYieldDiagnosticsTest.php > /tmp/diag-list.log 2> /dev/null
          grep -qF 'late user deprecation' /tmp/diag-list.log
          grep -qF 'late user warning' /tmp/diag-list.log
          grep -qF 'late user notice' /tmp/diag-list.log
          ./counit -c phpunit.xml.dist --generate-baseline /tmp/diag-baseline.xml tests/regression/PostYieldDiagnosticsTest.php > /dev/null 2>&1
          grep -qF 'late user deprecation' /tmp/diag-baseline.xml
          rc=0; ./counit -c phpunit.xml.dist --fail-on-deprecation tests/regression/PostYieldDiagnosticsManualTest.php > /dev/null 2>&1 || rc=$?; test "$rc" -eq 1
          rc=0; ./counit -c phpunit.xml.dist --fail-on-warning     tests/regression/PostYieldDiagnosticsManualTest.php > /dev/null 2>&1 || rc=$?; test "$rc" -eq 1
          rc=0; ./counit -c phpunit.xml.dist --fail-on-notice      tests/regression/PostYieldDiagnosticsTest.php       > /dev/null 2>&1 || rc=$?; test "$rc" -eq 1
          # Attribution: two tests trigger the same deprecation from the same line after
          # different sleeps (reversed completion order); the listing must name BOTH.
          ./counit -c phpunit.xml.dist --display-deprecations tests/regression/PostYieldDiagnosticsAttributionTest.php > /tmp/diag-attr.log 2> /dev/null
          grep -qF '2 tests triggered 1 deprecation' /tmp/diag-attr.log
          grep -qF 'PostYieldDiagnosticsAttributionTest::testAFirst' /tmp/diag-attr.log
          grep -qF 'PostYieldDiagnosticsAttributionTest::testBSecond' /tmp/diag-attr.log
          # E_USER_ERROR after a yield: PHPUnit's handler throws for it, and the delegation lets
          # that abort the body. Once deferred failures were only a STDERR block (exit code 1 vs
          # blocking's native 2); the replayed Test\Errored (see LateFailures) now converges the
          # summary, the listing and the exit code with blocking mode exactly. Before the
          # original fix the run was KILLED with exit code 255 in Swoole mode.
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/PostYieldUserErrorTest.php > /tmp/diag-ue.log 2> /tmp/diag-ue.err || rc=$?
          cat /tmp/diag-ue.log /tmp/diag-ue.err
          ! grep -qF 'Fatal error' /tmp/diag-ue.log
          ! grep -qF 'Fatal error' /tmp/diag-ue.err
          ! grep -qF 'already been reported as passed' /tmp/diag-ue.err
          test "$rc" -eq 2
          # PHP 8.4 deprecated passing E_USER_ERROR to trigger_error(), so the fixture's own
          # call adds a deprecation there and on 8.5, but not on the 8.3 leg -- the error count
          # is what this pins either way.
          grep -qE 'Tests: 1, Assertions: 0, Errors: 2(, Deprecations: 1)?\.' /tmp/diag-ue.log
          grep -qF 'E_USER_ERROR was triggered' /tmp/diag-ue.log

      - name: Test JUnit XML Assertion Counts
        # The JUnit report's per-testcase `assertions` attributes are captured from the
        # Test\Finished events, so under Swoole they used to carry the up-front assertion credit
        # (one extra per automatic-approach test, even with no yield anywhere), miss assertions
        # counted directly on the test object after a yield, and attribute post-yield assertions
        # to whatever test happened to be counting. counit now corrects the report before it is
        # written (segment accounting); the expected values are identical with and without Swoole.
        # The second run covers a test skipped from setUp(): it gets a <testcase> element but no
        # Test\Finished event, and its siblings' counts must not shift onto the wrong elements.
        run: |
          set -o pipefail
          cat > /tmp/check-junit.php <<'PHP'
          <?php
          [, $file, $suiteTotal] = $argv;
          $expected = json_decode(stream_get_contents(STDIN), true);
          $xml      = simplexml_load_file($file);
          foreach ($xml->xpath("//testcase") as $testCase) {
              $name = (string) $testCase["name"];
              if ((string) $testCase["assertions"] !== ($expected[$name] ?? null)) {
                  fwrite(STDERR, "unexpected assertions for {$name}: {$testCase["assertions"]}\n");
                  exit(1);
              }
              unset($expected[$name]);
          }
          if ($expected !== []) {
              fwrite(STDERR, "missing testcases: " . implode(", ", array_keys($expected)) . "\n");
              exit(1);
          }
          // Every testsuite aggregate (nested ones included, e.g. per data provider) must equal
          // the sum of its descendant testcases, and the top-level total must be the expected one.
          foreach ($xml->xpath("//testsuite") as $testSuite) {
              $sum = 0;
              foreach ($testSuite->xpath(".//testcase") as $testCase) {
                  $sum += (int) $testCase["assertions"];
              }
              if ((int) $testSuite["assertions"] !== $sum) {
                  fwrite(STDERR, "suite {$testSuite["name"]}: aggregate {$testSuite["assertions"]} != sum {$sum}\n");
                  exit(1);
              }
          }
          foreach ($xml->xpath("/testsuites/testsuite") as $testSuite) {
              if ((string) $testSuite["assertions"] !== $suiteTotal) {
                  fwrite(STDERR, "unexpected top-level suite total: {$testSuite["assertions"]}\n");
                  exit(1);
              }
          }
          PHP
          ./counit -c phpunit.xml.dist --log-junit /tmp/junit-count.xml tests/regression/JunitCountTest.php | tee /tmp/junit-count.log
          grep -qF 'OK (6 tests, 10 assertions)' /tmp/junit-count.log
          php /tmp/check-junit.php /tmp/junit-count.xml 10 <<'JSON'
          {
              "testOneImmediateAssertion": "1",
              "testTwoImmediateAssertions": "2",
              "testLateCountsAfterYield": "3",
              "testAssertsOnlyAfterYield": "1",
              "testEachDataSetCountsSeparately with data set #0": "1",
              "testEachDataSetCountsSeparately with data set #1": "2"
          }
          JSON
          ./counit -c phpunit.xml.dist --log-junit /tmp/junit-skip.xml tests/regression/JunitSkipTest.php | tee /tmp/junit-skip.log
          grep -qF 'Tests: 3, Assertions: 4, Skipped: 1.' /tmp/junit-skip.log
          php /tmp/check-junit.php /tmp/junit-skip.xml 4 <<'JSON'
          {
              "testBeforeTheSkippedOne": "1",
              "testSkippedFromSetUp": "0",
              "testAfterTheSkippedOne": "3"
          }
          JSON

      - name: Test Verdict-Sequencing Options
        # The --stop-on-* family (and, on PHPUnit 13, --repeat/--retry) makes PHPUnit decide
        # BETWEEN tests from the verdicts it has so far -- but under counit a post-yield verdict
        # used to exist only after the whole loop had finished: --stop-on-failure never stopped,
        # --repeat ran every repetition, and --retry never retried exactly the flaky post-yield
        # tests it exists for. While any of these options is active, counit now joins every test
        # at its first yield (see VerdictSequencing; serialized run, STDERR notice), so each
        # verdict is final before the next scheduling decision and the expected output is
        # identical with and without Swoole. --repeat/--retry legs are feature-detected (the
        # options do not exist on the 12.5 line).
        run: |
          rc=0
          ./counit -c phpunit.xml.dist --stop-on-failure tests/regression/StopOnFailureTest.php > /tmp/vs.log 2> /tmp/vs.err || rc=$?
          cat /tmp/vs.log /tmp/vs.err
          test "$rc" -eq 1
          grep -qF 'Tests: 1, Assertions: 2, Failures: 1.' /tmp/vs.log
          if php -r 'exit(extension_loaded("swoole") ? 0 : 1);'; then
            grep -qF 'verdict-sequencing option' /tmp/vs.err
          fi
          rc=0
          ./counit -c phpunit.xml.dist --stop-on-skipped tests/regression/LateSkipTest.php > /tmp/vs.log 2> /dev/null || rc=$?
          test "$rc" -eq 0
          grep -qF 'Tests: 1, Assertions: 0, Skipped: 1.' /tmp/vs.log
          rc=0
          ./counit -c phpunit.xml.dist --stop-on-risky tests/regression/UselessTestTest.php > /tmp/vs.log 2> /dev/null || rc=$?
          test "$rc" -eq 0
          grep -qF 'Tests: 1, Assertions: 0, Risky: 1.' /tmp/vs.log
          if ./vendor/bin/phpunit --help | grep -qF -- '--repeat'; then
            # --repeat stops a test's repetitions at its first failure (later ones are skipped);
            # RepeatFailureTest doubles as the guard for Counit::uniqueDeferredKey() -- should
            # the join regress, colliding deferred entries must not overwrite each other.
            rc=0
            ./counit -c phpunit.xml.dist --repeat 2 tests/regression/RepeatFailureTest.php > /tmp/vs.log 2> /dev/null || rc=$?
            test "$rc" -eq 1
            grep -qF 'Tests: 2, Assertions: 2, Failures: 1, Skipped: 1.' /tmp/vs.log
            # --retry: a first-attempt post-yield failure is retried; the run ends green.
            rc=0
            ./counit -c phpunit.xml.dist --retry 3 tests/regression/FlakyRetryTest.php > /tmp/vs.log 2> /dev/null || rc=$?
            test "$rc" -eq 0
            grep -qF 'OK (1 test, 1 assertion)' /tmp/vs.log
          fi

      - name: Test Late Failure/Error Handling
        # A failure or error that happens only after the test's first yield -- a body
        # assertion/exception, a relocated tearDown()/#[After] throwable, or a Counit::defer()
        # cleanup throwable -- used to surface only in counit's end-of-run STDERR block with a
        # forced exit code 1, while PHPUnit itself reported OK. The verdicts are now replayed
        # through PHPUnit's own Test\Failed/Test\Errored events once every coroutine has drained
        # (see LateFailures): summary counts, listings, exit codes and the JUnit report match
        # blocking mode exactly, so the expected output is identical with and without Swoole and
        # the old block must be absent. The data-set target pins the value-object identity
        # handling; the JUnit leg pins the corrector-written <failure>/<error> elements and the
        # recomputed aggregates (and, for the skip fixture, the <skipped/> elements).
        run: |
          for target in LateFailureTest LateFailureManualTest TearDownErrorTest; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/late-fail.log 2> /tmp/late-fail.err || rc=$?
            cat /tmp/late-fail.log /tmp/late-fail.err
            test "$rc" -eq 2
            ! grep -qF 'already been reported as passed' /tmp/late-fail.err
            case "$target" in
              LateFailureTest)       grep -qF 'Tests: 5, Assertions: 8, Errors: 1, Failures: 2.' /tmp/late-fail.log
                                     grep -qF 'testDataSetFailsAfterYield@failing set' /tmp/late-fail.log ;;
              LateFailureManualTest) grep -qF 'Tests: 2, Assertions: 3, Errors: 1, Failures: 1.' /tmp/late-fail.log ;;
              TearDownErrorTest)     grep -qF 'Tests: 2, Assertions: 2, Errors: 1.' /tmp/late-fail.log
                                     grep -qF 'deliberate tearDown() error' /tmp/late-fail.log ;;
            esac
          done
          # The JUnit report carries the verdicts: real <failure>/<error> elements with matching
          # testsuite aggregates, identical with and without Swoole.
          rc=0
          ./counit -c phpunit.xml.dist --log-junit /tmp/late-fail.xml tests/regression/LateFailureTest.php > /dev/null 2>&1 || rc=$?
          test "$rc" -eq 2
          php -r '
              $d = new DOMDocument();
              exit((int) !(
                  $d->load("/tmp/late-fail.xml")
                  && $d->getElementsByTagName("failure")->length === 2
                  && $d->getElementsByTagName("error")->length === 1
                  && $d->documentElement->firstElementChild->getAttribute("failures") === "2"
                  && $d->documentElement->firstElementChild->getAttribute("errors") === "1"
              ));
          '

      - name: Test Run History And Duration Corrections
        # PHPUnit persists its test-run history (PHPUnit 13; the result cache on 12.5, different
        # file name, same JSON shape) when the root suite finishes -- before counit's drain -- so
        # a post-yield failure used to be recorded as a pass, actively ERASING defects a previous
        # run had written (--order-by=defects lost exactly the tests it exists to front-load),
        # and every recorded duration was time-to-first-yield (0.001s for a 1s test; JUnit `time`
        # attributes had the same garbage). counit now re-persists the history after the late
        # emits and overwrites the times -- in the file and in the JUnit report -- with measured
        # wall-clock durations (see HistoryCorrector). Expected content is identical with and
        # without Swoole: the three post-yield defects present, the genuinely passing test's
        # entry absent, and every duration of a 1s-sleeping test at least 1s.
        run: |
          rm -rf /tmp/history
          rc=0
          ./counit -c phpunit.xml.dist --cache-directory /tmp/history --log-junit /tmp/history-junit.xml tests/regression/LateFailureTest.php > /dev/null 2>&1 || rc=$?
          test "$rc" -eq 2
          historyFile="/tmp/history/$(ls -A /tmp/history | head -1)"
          cat "$historyFile"; echo
          php -r '
              $prefix  = "Deminy\\Counit\\Tests\\LateFailureTest::";
              $history = json_decode((string) file_get_contents($argv[1]), true);
              $defects = $history["defects"] ?? [];
              $times   = $history["times"] ?? [];
              exit((int) !(
                  isset($defects[$prefix . "testFailsAfterYield"])
                  && isset($defects[$prefix . "testErrorsAfterYield"])
                  && isset($defects[$prefix . "testDataSetFailsAfterYield with data set \"failing set\""])
                  && !isset($defects[$prefix . "testPassesAfterYield"])
                  && ($times[$prefix . "testPassesAfterYield"] ?? 0) >= 1
                  && ($times[$prefix . "testFailsAfterYield"] ?? 0) >= 1
              ));
          ' "$historyFile"
          php -r '
              $d = new DOMDocument();
              if (!$d->load("/tmp/history-junit.xml")) { fwrite(STDERR, "report not readable\n"); exit(1); }
              $bad = [];
              foreach ($d->getElementsByTagName("testcase") as $testCase) {
                  // Every test in this fixture sleeps a second, so a duration anywhere near zero
                  // means the corrected wall-clock time did not reach the report. The threshold
                  // is loose on purpose: the point is 0.001-vs-1, not timing precision.
                  if ((float) $testCase->getAttribute("time") < 0.5) {
                      $bad[] = sprintf("%s time=[%s]", $testCase->getAttribute("name"), $testCase->getAttribute("time"));
                  }
              }
              if ($bad !== []) { fwrite(STDERR, "testcases without a corrected duration:\n  " . implode("\n  ", $bad) . "\n"); exit(1); }
          '

      - name: Test Aggregate Code Coverage
        # Under Swoole, essentially all post-yield test code runs during counit's end-of-run
        # drain -- outside every per-test coverage window -- so the aggregate report used to lose
        # those lines silently (25% vs blocking's 62.5% on this very fixture). counit now
        # opens one coverage window of its own around the drain (see Deminy\Counit\Coverage),
        # making the aggregate match a blocking run exactly; the expected percentages are
        # identical with and without Swoole. pcov.directory must be pointed at the fixture
        # directory explicitly (its auto-detection instruments src/ only), and neverCalled()
        # keeps the expected number below 100% so over-collection would be caught too.
        run: |
          set -o pipefail
          php -d pcov.directory=tests/regression/support ./counit -c phpunit.xml.dist \
            --coverage-filter tests/regression/support --coverage-text \
            tests/regression/CoverageDrainTest.php | tee /tmp/coverage.log
          grep -qF 'OK (3 tests, 6 assertions)' /tmp/coverage.log
          # Ratios, not percentages: php-code-coverage rounds 2/3 to 66.66% on the PHPUnit 13
          # line and 66.67% on the 12.5 one, while the counts are identical.
          grep -qF '(2/3)' /tmp/coverage.log
          grep -qF '(5/8)' /tmp/coverage.log
