name: Compatibility Tests

on: [ push, pull_request, workflow_dispatch ]

jobs:
  ci:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - {phpunit: "~8.0.0", php: "7.4"}
          - {phpunit: "~8.0", php: "7.4"}
          - {phpunit: "~8.0", php: "8.2"} # TODO: update to PHP 8.3.
          - {phpunit: "~9.0.0", php: "7.4"}
          - {phpunit: "~9.0", php: "7.4"}
          - {phpunit: "~9.0", php: "8.2"} # TODO: update to PHP 8.3.
        extensions:
          - swoole-stable
          - ""

    name: PHPUnit ${{ matrix.env.phpunit }} on PHP ${{ matrix.env.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.env.php }}
          tools: composer:v2
          extensions: ${{ matrix.extensions }}
          coverage: none

      - name: Install Dependencies
        run: composer install -nq --no-progress

      - name: Test Compatibility with PHPUnit
        # Assert the exact summary line, not just the exit code: a miscount or a risky test -- e.g.
        # a falsely credited @doesNotPerformAssertions test -- changes the summary while the run
        # still exits 0. The expected result is identical with and without Swoole.
        run: |
          set -o pipefail
          ./counit --testsuite compatibility | tee /tmp/compatibility.log
          grep -qF 'OK (48 tests, 58 assertions)' /tmp/compatibility.log

      - name: Test Late Skip/Incomplete Handling
        # A skip/incomplete signalled after the test's first yield cannot change the test's status
        # anymore (PHPUnit already reported the test as passed); counit must list such tests in an
        # end-of-run notice WITHOUT failing the run, while a skip requested before the first yield
        # keeps full PHPUnit semantics. The two modes deliberately diverge here, so each is
        # asserted against its own expected output; the exit code must be 0 in both. This cannot
        # live in the exact-summary-gated suite above, since a skipped test changes that summary
        # line by design.
        run: |
          set -o pipefail
          ./counit -c phpunit.xml.dist tests/regression/LateSkipTest.php > /tmp/late-skip.log 2> /tmp/late-skip.err
          cat /tmp/late-skip.log /tmp/late-skip.err
          if php -r 'exit(extension_loaded("swoole") ? 0 : 1);'; then
            grep -qF 'Tests: 3, Assertions: 0, Skipped: 1.' /tmp/late-skip.log
            grep -qF 'status remains "passed":' /tmp/late-skip.err
            grep -qF 'LateSkipTest::testSkippedAfterYield' /tmp/late-skip.err
            grep -qF 'LateSkipTest::testIncompleteAfterYield' /tmp/late-skip.err
          else
            grep -qF 'Tests: 3, Assertions: 0, Skipped: 2, Incomplete: 1.' /tmp/late-skip.log
          fi

      - name: Test Depends Failure Semantics
        # A producer failing only after a yield used to be recorded as passed at that yield: its
        # failure was deferred to an end-of-run notice and its dependent ran anyway, with a NULL
        # input. With the producer's coroutine joined, the failure lands inside runBare() like in
        # blocking mode: a real Failure, the dependent Skipped, exit code 1, and no deferred
        # failure block. The expected output is identical with and without Swoole. These cannot
        # live in the exact-summary-gated suite above, since the runs are expected to fail (or
        # report risky). The whole-class dependency form is exercised only where PHPUnit supports
        # it upstream (>= 9.3, where ExecutionOrderDependency exists) -- older versions warn that
        # the target does not exist, in blocking mode too.
        run: |
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/DependsFailureTest.php > /tmp/depends-fail.log 2> /tmp/depends-fail.err || rc=$?
          cat /tmp/depends-fail.log /tmp/depends-fail.err
          test "$rc" -eq 1
          grep -qF 'Tests: 3, Assertions: 2, Failures: 1, Skipped: 1.' /tmp/depends-fail.log
          # The dependent must not have run (its body fails loudly if it does) ...
          ! grep -qF 'the dependent of a failed producer must be skipped' /tmp/depends-fail.log
          # ... and the producer's failure must be a real one, not a deferred end-of-run notice.
          ! grep -qF 'already been reported as passed' /tmp/depends-fail.err
          # A joined producer that performs no assertions must stay risky -- the join path applies
          # no up-front assertion credit -- so its dependent is skipped; risky alone keeps the
          # exit code at 0, exactly as under PHPUnit.
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/DependsRiskyProducerTest.php > /tmp/depends-risky.log 2> /tmp/depends-risky.err || rc=$?
          cat /tmp/depends-risky.log /tmp/depends-risky.err
          test "$rc" -eq 0
          grep -qF 'Tests: 2, Assertions: 0, Skipped: 1, Risky: 1.' /tmp/depends-risky.log
          ! grep -qF 'the dependent of a risky producer must be skipped' /tmp/depends-risky.log
          if php -r 'exit(class_exists("PHPUnit\\Framework\\ExecutionOrderDependency") ? 0 : 1);'; then
            rc=0
            ./counit -c phpunit.xml.dist tests/regression/depends-on-class > /tmp/depends-class.log 2> /tmp/depends-class.err || rc=$?
            cat /tmp/depends-class.log /tmp/depends-class.err
            test "$rc" -eq 1
            grep -qF 'Tests: 3, Assertions: 2, Failures: 1, Skipped: 1.' /tmp/depends-class.log
            ! grep -qF 'the dependent of a not-fully-passed class must be skipped' /tmp/depends-class.log
            ! grep -qF 'already been reported as passed' /tmp/depends-class.err
          fi

      - name: Test After-Test Hook Semantics
        # These behaviors hold by architecture on this branch (the whole runBare() -- setUp(),
        # body, tearDown() -- runs inside the test's coroutine, so PHPUnit's own hook handling
        # applies untouched), while the 1.x branch needed dedicated fixes for them; the guards
        # pin that no future change here loses them. (1) A test whose setUp() throws or skips
        # still gets its tearDown(), and a tearDown() Throwable after the failed setUp() stays
        # swallowed -- identical output with and without Swoole. (2) A skip signalled from
        # tearDown() after a passing body is a GENUINE skip on PHPUnit 8/9 (upstream semantics,
        # unlike PHPUnit 10+ where it fails the test): the run must exit 0 in BOTH modes -- the
        # pre-yield skip honored natively, the post-yield one via the benign end-of-run notice.
        # This deliberately guards against ever porting the 1.x branch's exit-1 treatment (its
        # f5cbf24) to this branch. (3) A joined producer's tearDown() throw errors the producer
        # natively and skips its dependent -- identical in both modes, no deferred block.
        run: |
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/SetUpFailureHooksTest.php > /tmp/setup-fail.log 2> /tmp/setup-fail.err || rc=$?
          cat /tmp/setup-fail.log /tmp/setup-fail.err
          test "$rc" -eq 2
          grep -qF 'Tests: 4, Assertions: 3, Errors: 1, Skipped: 1.' /tmp/setup-fail.log
          # tearDown() must have run for both aborted tests (the guard test fails otherwise) ...
          ! grep -qF 'tearDown() must run' /tmp/setup-fail.log
          # ... its own post-setUp-failure Throwable must be swallowed ...
          ! grep -qF 'must be swallowed' /tmp/setup-fail.log
          ! grep -qF 'must be swallowed' /tmp/setup-fail.err
          # ... and nothing may surface as a deferred end-of-run failure.
          ! grep -qF 'already been reported as passed' /tmp/setup-fail.err
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/TearDownSkipTest.php > /tmp/teardown-skip.log 2> /tmp/teardown-skip.err || rc=$?
          cat /tmp/teardown-skip.log /tmp/teardown-skip.err
          test "$rc" -eq 0
          ! grep -qF 'already been reported as passed' /tmp/teardown-skip.err
          if php -r 'exit(extension_loaded("swoole") ? 0 : 1);'; then
            grep -qF 'Tests: 2, Assertions: 2, Skipped: 1.' /tmp/teardown-skip.log
            grep -qF 'status remains "passed":' /tmp/teardown-skip.err
            grep -qF 'TearDownSkipTest::testPostYieldSkipFromTearDown' /tmp/teardown-skip.err
          else
            grep -qF 'Tests: 2, Assertions: 2, Skipped: 2.' /tmp/teardown-skip.log
          fi
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/DependsTearDownTest.php > /tmp/depends-td.log 2> /tmp/depends-td.err || rc=$?
          cat /tmp/depends-td.log /tmp/depends-td.err
          test "$rc" -eq 2
          grep -qF 'Tests: 3, Assertions: 2, Errors: 1, Skipped: 1.' /tmp/depends-td.log
          ! grep -qF 'the dependent of an errored producer must be skipped' /tmp/depends-td.log
          ! grep -qF 'already been reported as passed' /tmp/depends-td.err

      - name: Test Exception Expectation Semantics
        # A test whose expected exception arrives only after a yield: the automatic approach
        # already verified a MATCHING throw natively (the whole runBare() runs inside the
        # coroutine), but its failing shapes were deferred, the manual approach failed
        # prematurely with "exception not thrown" plus a deferred duplicate, and the
        # expectWarning() family broke because PHPUnit's converting error handler was already
        # unregistered when the coroutine resumed. With the expectation-join in Counit::create(),
        # all of it reports exactly as under blocking PHPUnit: a mismatch fails with the real
        # comparison message, a never-arriving exception fails natively after the finished body,
        # a tearDown() throwing the very class the test expects ERRORS the test, and a delayed
        # warning converts and verifies. Identical with and without Swoole; the passing shapes
        # live in the exact-summary-gated suite above. The warning run's summary is asserted
        # with an alternation: PHPUnit >= 9.5 adds a deprecation warning about expecting
        # E_WARNING that older versions do not emit.
        run: |
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/ExceptionFailureTest.php > /tmp/exception-fail.log 2> /tmp/exception-fail.err || rc=$?
          cat /tmp/exception-fail.log /tmp/exception-fail.err
          test "$rc" -eq 2
          grep -qF 'Tests: 4, Assertions: 4, Errors: 1, Failures: 2.' /tmp/exception-fail.log
          grep -qF 'matches expected exception "RuntimeException"' /tmp/exception-fail.log
          grep -qF 'Failed asserting that exception of type "RuntimeException" is thrown.' /tmp/exception-fail.log
          grep -qF 'deliberate tearDown() throw of the very class the test expects' /tmp/exception-fail.log
          ! grep -qF 'already been reported as passed' /tmp/exception-fail.err
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/ExceptionFailureManualTest.php > /tmp/exception-manual.log 2> /tmp/exception-manual.err || rc=$?
          cat /tmp/exception-manual.log /tmp/exception-manual.err
          test "$rc" -eq 1
          grep -qF 'Tests: 2, Assertions: 2, Failures: 2.' /tmp/exception-manual.log
          grep -qF 'matches expected exception "RuntimeException"' /tmp/exception-manual.log
          ! grep -qF 'already been reported as passed' /tmp/exception-manual.err
          rc=0
          ./counit -c phpunit.xml.dist tests/regression/WarningAfterYieldTest.php > /tmp/warning.log 2> /tmp/warning.err || rc=$?
          cat /tmp/warning.log /tmp/warning.err
          test "$rc" -eq 0
          grep -qE '^(OK \(1 test, 1 assertion\)|Tests: 1, Assertions: 1, Warnings: 1\.)$' /tmp/warning.log
          ! grep -qF 'already been reported as passed' /tmp/warning.err

      - name: Test Time Limit Enforcement
        # --enforce-time-limit used to measure only up to a test's first yield under Swoole (an
        # over-limit test simply passed), and the SIGALRM php-invoker arms could outlive a joined
        # test's runBare() and abort an unrelated test's coroutine. counit now joins every test at
        # its first yield while the option is active, so PHPUnit times the real runBare() and
        # reports the timeout natively -- a RiskyTestError carrying php-invoker's "Execution
        # aborted" message, --fail-on-risky honored -- at the cost of the run being serialized for
        # its duration. On PHPUnit 8/9 the aborted test is flagged risky twice (the abort plus
        # "did not perform any assertions", since the joined path applies no assertion credit),
        # hence Risky: 2. The expected output is identical with and without Swoole; pcntl is
        # required in both modes (PHPUnit itself silently skips enforcement without it), hence the
        # guard so a runner losing pcntl fails loudly instead of the whole step silently passing
        # for the wrong reason.
        run: |
          php -r 'exit(extension_loaded("pcntl") ? 0 : 1);'
          for target in TimeLimitAutomaticTest TimeLimitManualTest TimeLimitLargeTest; do
            rc=0
            ./counit -c phpunit.xml.dist --enforce-time-limit --default-time-limit=1 "tests/regression/${target}.php" > /tmp/time-limit.log 2> /tmp/time-limit.err || rc=$?
            cat /tmp/time-limit.log /tmp/time-limit.err
            test "$rc" -eq 0
            # Nothing may surface as a deferred end-of-run failure: the timeout must land inside
            # PHPUnit's native handling, not in counit's after-the-summary block.
            ! grep -qF 'already been reported as passed' /tmp/time-limit.err
            case "$target" in
              TimeLimitLargeTest)
                # A @large class sleeps past the 1-second default limit but under the 60-second
                # large-test limit: the per-size timeout selection is PHPUnit's own in both modes.
                grep -qF 'OK (1 test, 1 assertion)' /tmp/time-limit.log
                ;;
              *)
                grep -qF 'Tests: 2, Assertions: 1, Risky: 2.' /tmp/time-limit.log
                grep -qF 'Execution aborted after 1 second' /tmp/time-limit.log
                ;;
            esac
          done
          # The serialized-run notice is printed under Swoole only, and --fail-on-risky must flip
          # the exit code natively in both modes.
          if php -r 'exit(extension_loaded("swoole") ? 0 : 1);'; then
            grep -qF 'the run is serialized' /tmp/time-limit.err
          fi
          rc=0
          ./counit -c phpunit.xml.dist --enforce-time-limit --default-time-limit=1 --fail-on-risky tests/regression/TimeLimitAutomaticTest.php > /tmp/time-limit-risky.log 2>&1 || rc=$?
          cat /tmp/time-limit-risky.log
          test "$rc" -eq 1

      - name: Test Global-State Backup Semantics
        # @backupGlobals / @backupStaticAttributes (and the matching configuration): PHPUnit
        # snapshots global state as nearly the first statement of runBare() and restores as
        # nearly the last. On this branch the automatic approach runs the whole runBare() inside
        # the test's coroutine, so the backed-up test's own isolation was already correct -- but
        # the snapshot window spanned the test's entire concurrent lifetime, and the restore
        # reverted every overlapping test's global writes; the manual approach (whose runBare()
        # is PHPUnit's own, on the main coroutine) additionally had the restore fire at the
        # body's first yield, reverting its own pre-yield writes mid-test and leaking post-yield
        # ones. A static-attributes snapshot also rewound counit's own bookkeeping, skewing the
        # run's assertion total. counit now drains all in-flight coroutines before the snapshot
        # (in AssertionCountListener::startTest(), the seam just ahead of runBare()) and joins
        # the backed-up test, giving the snapshot/restore pair an exclusive window; with it, the
        # statics rewind is self-healing. The expected output is identical with and without
        # Swoole, including under a run-wide --globals-backup (which serializes the run) and
        # under --strict-global-state (whose before/after comparison now brackets the same
        # exclusive window as in blocking mode).
        run: |
          for target in BackupGlobalsTest BackupGlobalsManualTest BackupCollateralTest BackupStaticsTest; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/backup.log 2> /tmp/backup.err || rc=$?
            cat /tmp/backup.log /tmp/backup.err
            test "$rc" -eq 0
            # Nothing may surface in a deferred end-of-run block.
            ! grep -qF 'already been reported as passed' /tmp/backup.err
            case "$target" in
              BackupGlobalsTest)       grep -qF 'OK (2 tests, 4 assertions)' /tmp/backup.log ;;
              BackupGlobalsManualTest) grep -qF 'OK (2 tests, 3 assertions)' /tmp/backup.log ;;
              BackupCollateralTest)    grep -qF 'OK (3 tests, 3 assertions)' /tmp/backup.log ;;
              BackupStaticsTest)       grep -qF 'OK (4 tests, 4 assertions)' /tmp/backup.log ;;
            esac
          done
          # Run-wide backup configuration: same exact output, serialized under Swoole.
          rc=0
          ./counit -c phpunit.xml.dist --globals-backup tests/regression/BackupGlobalsTest.php > /tmp/backup-cfg.log 2> /tmp/backup-cfg.err || rc=$?
          cat /tmp/backup-cfg.log /tmp/backup-cfg.err
          test "$rc" -eq 0
          grep -qF 'OK (2 tests, 4 assertions)' /tmp/backup-cfg.log
          # --strict-global-state: the mutating backed-up test is flagged risky, natively, in
          # both modes -- its comparison snapshots now bracket the same exclusive window.
          rc=0
          ./counit -c phpunit.xml.dist --strict-global-state tests/regression/BackupGlobalsTest.php > /tmp/backup-strict.log 2>&1 || rc=$?
          cat /tmp/backup-strict.log
          test "$rc" -eq 0
          grep -qF 'Tests: 2, Assertions: 4, Risky: 1.' /tmp/backup-strict.log
          grep -qF 'Global variables before the test' /tmp/backup-strict.log
          # The POST-yield write must appear in the comparison diff -- proof the second
          # snapshot was taken after the real body, not at the first yield.
          grep -qF "'counit_bg_post' => 'post-yield'" /tmp/backup-strict.log

      - name: Test Post-Condition Hooks
        # PHPUnit runs the post-condition phase (assertPostConditions() and postCondition-annotated
        # methods) from runBare(), right after the test method invocation returns. The automatic
        # approach was never broken here -- the whole runBare() runs inside the test's coroutine,
        # so the phase always follows the finished body (PostConditionsTest pins that, and that the
        # manual-approach join's detection never leaks into the automatic wrapper's own
        # Counit::create() call). The manual approach had the 1.x mistiming: its runBare() is
        # PHPUnit's own, on the main coroutine, so a customized hook used to inspect the test at
        # the body's first yield -- and it ran even when the body failed only after a yield, where
        # blocking PHPUnit skips the phase. Counit::create() now detects a customizing class by
        # reflection and joins, so the phase runs after the finished body and a throwing hook
        # fails/errors the test natively. Since joined tests get no assertion credit, a customizing
        # test performing no assertions is risky again, exactly as under blocking PHPUnit (the
        # Risky target); the Skip target pins the skip-on-failure half: the post-yield body failure
        # is native (not deferred) and the hook must not have run. The expected output is identical
        # with and without Swoole.
        run: |
          # The postCondition/preCondition annotations (and the hook list backing them) exist
          # only as of PHPUnit 9.1 -- earlier versions invoke assertPostConditions() directly --
          # so the annotation target is exercised only where upstream honors it (blocking PHPUnit
          # fails that test identically on older versions, since its annotated hooks never run).
          targets="PostConditionsTest PostConditionsManualTest PostConditionsRiskyTest PostConditionsSkipTest"
          if php -r 'require "vendor/autoload.php"; exit(array_key_exists("postCondition", PHPUnit\Util\Test::getHookMethods(PHPUnit\Framework\TestCase::class)) ? 0 : 1);'; then
            targets="$targets PostConditionAnnotationTest"
          fi
          for target in $targets; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/postcond.log 2> /tmp/postcond.err || rc=$?
            cat /tmp/postcond.log /tmp/postcond.err
            # Nothing may surface in a deferred end-of-run block.
            ! grep -qF 'already been reported as passed' /tmp/postcond.err
            case "$target" in
              PostConditionsTest)
                test "$rc" -eq 0
                grep -qF 'OK (2 tests, 4 assertions)' /tmp/postcond.log ;;
              PostConditionsManualTest)
                test "$rc" -eq 0
                grep -qF 'OK (2 tests, 4 assertions)' /tmp/postcond.log ;;
              PostConditionAnnotationTest)
                test "$rc" -eq 0
                grep -qF 'OK (1 test, 2 assertions)' /tmp/postcond.log ;;
              PostConditionsRiskyTest)
                test "$rc" -eq 0
                grep -qF 'Tests: 1, Assertions: 0, Risky: 1.' /tmp/postcond.log
                grep -qF 'This test did not perform any assertions' /tmp/postcond.log ;;
              PostConditionsSkipTest)
                test "$rc" -eq 1
                grep -qF 'Tests: 1, Assertions: 1, Failures: 1.' /tmp/postcond.log
                # The test fails natively with the BODY's message; the post-condition hook
                # must never have run for the failed body.
                grep -qF 'late failure' /tmp/postcond.log
                ! grep -qF 'post-conditions must not run' /tmp/postcond.log ;;
            esac
          done

      - name: Test Output Expectations
        # Swoole gives every coroutine its own output-buffer stack. The automatic approach was
        # never broken here -- the whole runBare(), PHPUnit's ob_start() and verification
        # included, runs inside the test's coroutine, whose private buffer survives its yields
        # (OutputExpectationTest pins that, and that the manual-approach capture never
        # double-wraps the automatic wrapper's own Counit::create() call). The manual approach
        # had the 1.x defect: its runBare() is PHPUnit's own, on the main coroutine, so the
        # callable's echo -- running in the spawned coroutine -- never reached PHPUnit's buffer
        # and expectations compared against '' unconditionally, before or after a yield.
        # Counit::create() now captures the coroutine's output, joins a test with a registered
        # expectation at its first yield (via the public hasExpectationOnOutput()), and replays
        # the captured bytes into PHPUnit's still-open buffer, so match, mismatch and
        # never-printed all verify natively against the real, complete output. The pollution
        # target pins the isolation (noisy bystanders overlapping expecting tests). The expected
        # output is identical with and without Swoole.
        run: |
          for target in OutputExpectationTest OutputExpectationManualTest OutputMismatchTest OutputPollutionTest; do
            rc=0
            ./counit -c phpunit.xml.dist "tests/regression/${target}.php" > /tmp/output.log 2> /tmp/output.err || rc=$?
            cat /tmp/output.log /tmp/output.err
            # Nothing may surface in a deferred end-of-run block.
            ! grep -qF 'already been reported as passed' /tmp/output.err
            case "$target" in
              OutputExpectationTest)
                test "$rc" -eq 0
                grep -qF 'OK (3 tests, 3 assertions)' /tmp/output.log ;;
              OutputExpectationManualTest)
                test "$rc" -eq 0
                grep -qF 'OK (2 tests, 2 assertions)' /tmp/output.log ;;
              OutputMismatchTest)
                test "$rc" -eq 1
                grep -qF 'Tests: 2, Assertions: 2, Failures: 2.' /tmp/output.log
                # The failures must carry the REAL actual output, not the empty string the
                # missing capture used to compare against.
                grep -qF "+'actual'" /tmp/output.log ;;
              OutputPollutionTest)
                test "$rc" -eq 0
                grep -qF 'OK (5 tests, 5 assertions)' /tmp/output.log ;;
            esac
          done

      - name: Test JUnit XML Assertion Counts
        # The JUnit report's per-testcase `assertions` attributes are read from each test object as
        # PHPUnit reports it, so under Swoole they used to carry the up-front assertion credit (one
        # extra per automatic-approach test, even with no yield anywhere), miss assertions counted
        # on the test object after a yield, and attribute post-yield assertions to whatever test
        # happened to be counting. counit now corrects the report before it is written (segment
        # accounting); the expected values are identical with and without Swoole. The third run
        # covers a test skipped from setUp(): its element keeps assertions="0" and its siblings'
        # counts must not shift onto the wrong elements.
        run: |
          set -o pipefail
          cat > /tmp/check-junit.php <<'PHP'
          <?php
          [, $file, $suiteTotal] = $argv;
          $expected = json_decode(stream_get_contents(STDIN), true);
          $xml      = simplexml_load_file($file);
          foreach ($xml->xpath("//testcase") as $testCase) {
              $name = (string) $testCase["name"];
              if ((string) $testCase["assertions"] !== ($expected[$name] ?? null)) {
                  fwrite(STDERR, "unexpected assertions for {$name}: {$testCase["assertions"]}\n");
                  exit(1);
              }
              unset($expected[$name]);
          }
          if ($expected !== []) {
              fwrite(STDERR, "missing testcases: " . implode(", ", array_keys($expected)) . "\n");
              exit(1);
          }
          // Every testsuite aggregate (nested ones included, e.g. per data provider) must equal
          // the sum of its descendant testcases, and the top-level total must be the expected one.
          foreach ($xml->xpath("//testsuite") as $testSuite) {
              $sum = 0;
              foreach ($testSuite->xpath(".//testcase") as $testCase) {
                  $sum += (int) $testCase["assertions"];
              }
              if ((int) $testSuite["assertions"] !== $sum) {
                  fwrite(STDERR, "suite {$testSuite["name"]}: aggregate {$testSuite["assertions"]} != sum {$sum}\n");
                  exit(1);
              }
          }
          foreach ($xml->xpath("/testsuites/testsuite") as $testSuite) {
              if ((string) $testSuite["assertions"] !== $suiteTotal) {
                  fwrite(STDERR, "unexpected top-level suite total: {$testSuite["assertions"]}\n");
                  exit(1);
              }
          }
          PHP
          ./counit -c phpunit.xml.dist --log-junit /tmp/junit-count.xml tests/regression/JunitCountTest.php | tee /tmp/junit-count.log
          grep -qF 'OK (6 tests, 10 assertions)' /tmp/junit-count.log
          php /tmp/check-junit.php /tmp/junit-count.xml 10 <<'JSON'
          {
              "testOneImmediateAssertion": "1",
              "testTwoImmediateAssertions": "2",
              "testLateCountsAfterYield": "3",
              "testAssertsOnlyAfterYield": "1",
              "testEachDataSetCountsSeparately with data set #0": "1",
              "testEachDataSetCountsSeparately with data set #1": "2"
          }
          JSON
