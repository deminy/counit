name: Unit Tests

on:
  push:
  pull_request:
  # Weekly, so a new PHPUnit release that breaks counit is noticed even when nothing is pushed:
  # PHPUnit 13.4.0 broke counit silently for runs resolving it, with no commit here to trigger CI.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # "~13.0.0" pins the oldest 13.x minor (latest 13.0.x patch); "~13.0" follows the newest 13.x release.
        phpunit: ["~12.5.24", "~13.0.0", "~13.0"]

    name: Run Tests With PHPUnit ${{ matrix.phpunit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start Docker Containers
        uses: hoverkraft-tech/compose-action@v3

      - name: Install Dependencies
        run: |
          set -ex

          sleep 15 # Seems that we need to give the MySQL container enough time to warm up.

          docker compose exec -T swoole composer require "phpunit/phpunit=${{ matrix.phpunit }}" -W -nq --no-progress
          docker compose exec -T swoole ./vendor/bin/phpunit --version # Check current version of PHPUnit.

      - name: Run Unit Tests
        run: |
          set -ex -o pipefail

          # Run tests using PHPUnit (Swoole is disabled).
          docker compose exec -T php ./vendor/bin/phpunit --testsuite automatic
          docker compose exec -T php ./vendor/bin/phpunit --testsuite manual

          # Run tests using PHPUnit, with Swoole enabled.
          docker compose exec -T swoole ./vendor/bin/phpunit --testsuite automatic
          docker compose exec -T swoole ./vendor/bin/phpunit --testsuite manual

          # Run tests using counit (Swoole is disabled).
          docker compose exec -T php ./counit --testsuite automatic
          docker compose exec -T php ./counit --testsuite manual

          # Run tests using counit, with Swoole enabled.
          docker compose exec -T swoole ./counit --testsuite automatic
          docker compose exec -T swoole ./counit --testsuite manual 2>&1 | tee /tmp/manual-swoole.log

          # A run silently falling back to blocking mode still passes, with the blocking summary
          # (Assertions: 62, Skipped: 2): CoroutineGroupTest skips a different test inside a
          # coroutine, so only the concurrent path produces this exact line. PHPUnit 13.4.0 broke
          # counit's invocation routing that way without failing any step here.
          grep -qF 'Tests: 38, Assertions: 64, Skipped: 1.' /tmp/manual-swoole.log
          # Nor may a clean run print a "counit notice:" line: counit announces there when a
          # PHPUnit internal it depends on has changed and a feature fell back.
          # (Not "! grep": bash's errexit ignores a negated command unless it is the last one.)
          if grep -qF 'counit notice:' /tmp/manual-swoole.log; then exit 1; fi
